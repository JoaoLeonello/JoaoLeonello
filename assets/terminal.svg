<svg xmlns="http://www.w3.org/2000/svg" width="860" height="364" viewBox="0 0 860 364" role="img" aria-label="whoami: João Leonello, Full Stack Developer">
  <title>whoami — João Leonello</title>
  <style>
    text { font-family: "JetBrains Mono", "Fira Code", "Courier New", monospace; font-size: 15px; }
    .p { fill: #4ade80; font-weight: 700; }
    .c { fill: #e5ffe9; font-weight: 400; }
    .h { fill: #4ade80; font-size: 30px; font-weight: 700; letter-spacing: 2px; filter: url(#glow); }
    .d { fill: #86efac; fill-opacity: .8; }
    .o { fill: #86efac; }
    .t { fill: #4ade80; font-size: 13px; opacity: .8; }
    .a { opacity: 0; animation: show .01s forwards; }
    .cur { animation: blink 1s steps(1) infinite; }
    .scan { animation: scan 6s linear infinite; }
    @keyframes show { to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes scan { from { transform: translateY(-80px); } to { transform: translateY(364px); } }
  </style>
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="lines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity=".35"/>
    </pattern>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0"/>
      <stop offset=".5" stop-color="#4ade80" stop-opacity=".08"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="win"><rect x="1" y="1" width="858" height="362" rx="10"/></clipPath>
  </defs>

