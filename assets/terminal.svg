c a" style="animation-delay:6.75s">-</tspan><tspan class="c a" style="animation-delay:6.82s">1</tspan></text></g>
    <text x="32" y="312" class="o a" style="animation-delay:7.24s">&gt; notes on software engineering &amp; computer science</text>
    <g class="a" style="animation-delay:7.42s"><text x="32" y="336" class="p">joao@bitwise-ops<tspan fill="#86efac">:</tspan><tspan fill="#22c55e">~</tspan><tspan fill="#86efac">$ </tspan><tspan class="cur">█</tspan></text></g>
    <rect width="860" height="364" fill="url(#lines)"/>
    <rect class="scan" width="860" height="80" fill="url(#beam)"/>
