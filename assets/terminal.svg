    <text x="32" y="228" class="o a" style="animation-delay:3.87s">&gt; algorithms nerd, language-agnostic, ships from design to prod</text>
    <text x="32" y="252" class="o a" style="animation-delay:4.05s">&gt; code quality · automated tests · CI/CD · observability</text>
