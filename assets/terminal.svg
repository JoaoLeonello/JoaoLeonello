    <g class="a" style="animation-delay:2.08s"><text x="32" y="180" class="p">joao@bitwise-ops<tspan fill="#86efac">:</tspan><tspan fill="#22c55e">~</tspan><tspan fill="#86efac">$ </tspan><tspan class="c a" style="animation-delay:2.43s">c</tspan><tspan class="c a" style="animation-delay:2.50s">a</tspan><tspan class="c a" style="animation-delay:2.57s">t</tspan><tspan class="c a" style="animation-delay:2.64s"> </tspan><tspan class="c a" style="animation-delay:2.71s">a</tspan><tspan class="c a" style="animation-delay:2.78s">b</tspan><tspan class="c a" style="animation-delay:2.85s">o</tspan><tspan class="c a" style="animation-delay:2.92s">u</tspan><tspan class="c a" style="animation-delay:2.99s">t</tspan><tspan class="c a" style="animation-delay:3.06s">.</tspan><tspan class="c a" style="animation-delay:3.13s">t</tspan><tspan class="c a" style="animation-delay:3.20s">x</tspan><tspan class="c a" style="animation-delay:3.27s">t</tspan></text></g>
